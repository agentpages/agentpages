name: Upstream spec
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-apps-unchanged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-upstream.sh
        env:
          GH_TOKEN: ${{ github.token }}
