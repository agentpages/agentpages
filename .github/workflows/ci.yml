name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:quick
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation ${{ matrix.shard }}/8
  check:
    if: always()
    needs: [quick, mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Every part of pnpm check passed
        run: test "${{ needs.quick.result }}" = success && test "${{ needs.mutation.result }}" = success
  pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Description is within 250 words
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: test "$(printf '%s' "$BODY" | wc -w)" -le 250
